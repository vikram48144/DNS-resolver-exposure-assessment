options {
    directory "/var/cache/bind";

    recursion yes;

    allow-recursion {
        10.10.0.0/24;
    };

    allow-query {
        10.10.0.0/24;
    };

    listen-on {
        any;
    };

    listen-on-v6 {
        none;
    };

    forwarders {
        127.0.0.11;
    };

    forward only;

    dnssec-validation no;
};