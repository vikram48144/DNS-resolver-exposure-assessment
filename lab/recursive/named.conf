acl "trusted_clients" {
    10.10.0.0/24;
};

options {
    directory "/var/cache/bind";

    recursion yes;

    allow-recursion {
        trusted_clients;
    };

    allow-query-cache {
        trusted_clients;
    };

    allow-query {
        any;
    };

    listen-on {
        any;
    };

    listen-on-v6 {
        none;
    };

    forwarders {
        127.0.0.11;
    };

    forward only;

    dnssec-validation no;
};
