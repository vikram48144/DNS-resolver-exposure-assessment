services:

  packet-capture:
    image: nicolaka/netshoot:latest
    container_name: dns-packet-capture
    command: sleep infinity
    cap_add:
      - NET_ADMIN
      - NET_RAW
    volumes:
      - ./captures:/captures
    networks:
      dns-lab:
        ipv4_address: 10.10.0.10

  recursive-dns:
    image: ubuntu/bind9:latest
    container_name: recursive-dns
    volumes:
      - ./lab/recursive/named.conf:/etc/bind/named.conf:ro
    networks:
      dns-lab:
        ipv4_address: 10.10.0.2
      external-test:
        ipv4_address: 10.20.0.2

  authoritative-dns:
    image: ubuntu/bind9:latest
    container_name: authoritative-dns
    volumes:
      - ./lab/authoritative/named.conf:/etc/bind/named.conf:ro
      - ./lab/authoritative/db.lab.example:/etc/bind/db.lab.example:ro
    networks:
      dns-lab:
        ipv4_address: 10.10.0.3

  refused-dns:
    image: ubuntu/bind9:latest
    container_name: refused-dns
    volumes:
      - ./lab/refused/named.conf:/etc/bind/named.conf:ro
    networks:
      dns-lab:
        ipv4_address: 10.10.0.4

  dns-probe:
    depends_on:
      - recursive-dns
      - authoritative-dns
      - refused-dns
      - unauthorized-dns-client
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dns-probe

    ports:
      - "5000:5000"

    volumes:
      - ./artifacts/results:/app/artifacts/results
      - ./artifacts/logs:/app/artifacts/logs
      - ./captures:/app/captures:ro
      - acl-exchange:/acl-exchange
    environment:
      ACL_EXCHANGE_DIR: /acl-exchange

    networks:
      dns-lab:
        ipv4_address: 10.10.0.20


  unauthorized-dns-client:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: unauthorized-dns-client
    command: ["python", "-B", "-m", "security.recursion_access_test", "--worker"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    environment:
      ACL_EXCHANGE_DIR: /acl-exchange
    volumes:
      - acl-exchange:/acl-exchange
    networks:
      external-test:
        ipv4_address: 10.20.0.30

volumes:
  acl-exchange:

networks:
  dns-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
  external-test:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 10.20.0.0/24
